[project]
name = "heiwa-universe"
version = "0.1.0"
description = "Local-first AI runtime and operator surface for Heiwa"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Heiwa", email = "noreply@heiwa.dev" }]
license = { text = "Apache-2.0" }
dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
    "tenacity>=8.2.0",
    "cryptography>=42.0.0",
    "fastapi>=0.135.3",
    "uvicorn>=0.42.0",
    "requests>=2.33.1",
    "httpx>=0.28.1",
    "aiohttp>=3.13.5",
    "websockets>=16.0",
    "psycopg2-binary>=2.9.11",
    "discord.py>=2.7.1",
    "rich>=14.3.3",
    "prompt_toolkit>=3.0.52",
    "textual>=8.2.1",
]

[project.urls]
Homepage = "https://github.com/Strategizing/heiwa-universe"
Repository = "https://github.com/Strategizing/heiwa-universe"
Documentation = "https://strategizing.github.io/heiwa-universe/"
Issues = "https://github.com/Strategizing/heiwa-universe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.6,<10.0",
    "pymdown-extensions>=10.21.3,<11.0",
]

[tool.pytest.ini_options]
# Legacy Hub tests are repair targets, not the default GitHub product gate.
testpaths = ["apps/heiwa_trading/tests", "scripts/tests"]
pythonpath = ["apps/heiwa_trading/src", "scripts"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--tb=short -q"
