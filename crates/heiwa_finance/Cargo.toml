[package]
name = "heiwa_finance"
version = "0.1.0"
edition = "2021"
description = "Read-only finance plane for Heiwa: brokerage aggregation, market data, local text truth, and deterministic portfolio analytics. There is no order or money-movement path."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
