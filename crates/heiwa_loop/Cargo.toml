[package]
name = "heiwa-loop"
version = "0.1.0"
edition = "2021"
description = "Routing and bounded execution loop primitives for Heiwa"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
heiwa-bindings = { path = "../../packages/heiwa_bindings/rust" }
heiwa-stdb = { path = "../../crates/heiwa_stdb" }
heiwa-protocol = { path = "../../crates/heiwa_protocol" }
heiwa-core = { path = "../../apps/heiwa_core" }
heiwa-provider = { path = "../../crates/heiwa_provider" }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
