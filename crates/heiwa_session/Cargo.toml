[package]
name = "heiwa-session"
version = "0.1.0"
edition = "2021"
description = "Session daemon and PTY primitives for Heiwa"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1.0"
heiwa-config = { path = "../heiwa_config", package = "heiwa_config" }
heiwa-embed = { path = "../heiwa_embed", package = "heiwa_embed" }
heiwa-protocol = { path = "../../crates/heiwa_protocol" }
portable-pty = { version = "0.9.0", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
