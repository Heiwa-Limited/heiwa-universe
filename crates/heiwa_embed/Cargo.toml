[package]
name = "heiwa_embed"
version = "0.1.0"
edition = "2021"
description = "Local embedding generation and vector storage for Heiwa"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = "1"
futures = { version = "0.3.32", optional = true }
heiwa_config = { path = "../heiwa_config" }
lancedb = { version = "0.31.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread"], optional = true }

[features]
default = []
lance = ["dep:lancedb", "dep:futures", "dep:tokio"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }

