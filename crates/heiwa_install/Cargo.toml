[package]
name = "heiwa-install"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
heiwa-paths = { path = "../heiwa_paths" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
