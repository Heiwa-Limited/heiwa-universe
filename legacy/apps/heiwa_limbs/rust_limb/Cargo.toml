[package]
name = "iclaw-rust-limb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Strategizing/heiwa-universe"
homepage = "https://github.com/Strategizing/heiwa-universe"
documentation = "https://strategizing.github.io/heiwa-universe/"

[dependencies]
spacetimedb-sdk = "2.0.2"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
log = "0.4"
reqwest = { version = "0.11", features = ["json"] }
env_logger = "0.10"
