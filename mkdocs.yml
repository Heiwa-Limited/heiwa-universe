site_name: Heiwa
site_description: Local-first AI runtime documentation for Heiwa
site_url: https://strategizing.github.io/heiwa-universe/
repo_url: https://github.com/Strategizing/heiwa-universe
repo_name: Strategizing/heiwa-universe

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: deep orange

exclude_docs: |
  audit/**
  design/**
  enterprise/**
  railway-self-operation.md
  superpowers/**

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: ignore

nav:
  - Home: index.md
  - Current Capability: current-capability.md
  - Architecture: architecture.md
  - Provider Registry: provider-registry.md
  - Routing Policy: routing.md
  - Plugins: plugins.md
  - Deployment: deployment.md
  - Security: security.md
  - Failure Modes: failure-modes.md
  - Operator Runbook: operator-runbook.md
  - References:
      - Upstream References: references/UPSTREAM_REFERENCES.md
