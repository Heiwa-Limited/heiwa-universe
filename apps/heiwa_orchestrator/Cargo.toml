[package]
name = "heiwa-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Legacy orchestration binary for Heiwa runtime flows"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "heiwa-orchestrator"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dirs = "6"
heiwa-protocol = { path = "../../crates/heiwa_protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50.0", features = ["full"] }
