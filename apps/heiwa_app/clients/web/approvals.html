<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Heiwa Operator | Approvals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <script defer src="./assets/site.js"></script>
    <script defer src="./assets/operator.js"></script>
  </head>
  <body data-page="approvals" data-view="approvals">
    <div class="bg-grid" aria-hidden="true"></div>
    <header class="topbar">
      <a class="brand" href="./connections.html">HEIWA OPERATOR</a>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a href="./connections.html">Connections</a>
        <a href="./missions.html">Mission Control</a>
        <a href="./live.html">Live Run</a>
        <a href="./approvals.html">Approvals</a>
        <a href="./rate-groups.html">Rate Groups</a>
        <a href="./cells.html">Cells</a>
        <a href="./history.html">History</a>
      </nav>
    </header>
    <main>
      <section class="hero compact">
        <p class="eyebrow">Operator App</p>
        <h1>Pending approvals without leaving the app.</h1>
        <p class="lede">Inline REPL approvals remain primary, but the same queue is available here for remote or delayed decisions.</p>
        <div class="operator-toolbar">
          <div class="operator-actions">
            <button id="set-token" class="btn btn-solid">Set Token</button>
            <button id="clear-token" class="btn btn-outline">Clear Token</button>
            <button id="refresh-view" class="btn btn-outline">Refresh</button>
          </div>
          <span id="token-status" class="token-chip warn">token missing</span>
        </div>
      </section>
      <section class="panels">
        <article class="panel panel-full">
          <div id="operator-root" class="stack"></div>
        </article>
      </section>
    </main>
  </body>
</html>
