[package]
name = "heiwa-shell"
version = "0.1.0"
edition = "2021"
description = "Installed heiwa CLI surface for the Heiwa local-first AI runtime"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "heiwa"
path = "src/main.rs"

[lib]
name = "heiwa_shell"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
heiwa-bindings = { path = "../../packages/heiwa_bindings/rust" }
heiwa-core = { path = "../../apps/heiwa_core" }
heiwa-session = { path = "../../crates/heiwa_session" }
heiwa-repl = { path = "../../crates/heiwa_repl" }
heiwa-provider = { path = "../../crates/heiwa_provider" }
heiwa_quota = { path = "../../crates/heiwa_quota" }
heiwa-install = { path = "../../crates/heiwa_install" }
heiwa-loop = { path = "../../crates/heiwa_loop" }
heiwa-stdb = { path = "../../crates/heiwa_stdb" }
heiwa-protocol = { path = "../../crates/heiwa_protocol" }
heiwa_mcp = { path = "../../crates/heiwa_mcp" }
heiwa-tui = { path = "../../crates/heiwa_tui" }
heiwa_drex = { path = "../../crates/heiwa_drex" }
uuid = { version = "1.0", features = ["v4"] }
hostname = "0.4"
dirs = "5.0"
tokio = { version = "1.50.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"

