name: Heiwa CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH

  rust-matrix:
    name: Rust Build, Test, and Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: security-scan
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          prefix-key: v1-rust
          cache-bin: false
      - name: Cargo build
        run: cargo build --workspace --locked
      - name: Cargo test
        run: cargo test --workspace --locked
      - name: Cargo clippy
        run: >
          cargo clippy --workspace --locked --all-targets --
          -A clippy::too_many_arguments
          -A clippy::new_without_default
          -A clippy::unnecessary_to_owned
          -A clippy::needless_range_loop
          -A clippy::approx_constant
          -A clippy::collapsible_if
          -A clippy::bool_assert_comparison
          -A clippy::type_complexity
          -A clippy::needless_borrows_for_generic_args
          -A clippy::unnecessary_unwrap
          -D warnings
      - name: Install cargo-machete
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-machete --locked
      - name: Check unused Rust dependencies
        if: matrix.os == 'ubuntu-latest'
        run: >
          cargo machete
          apps/heiwa_core
          apps/heiwa_orchestrator
          apps/heiwa_shell
          crates/heiwa_config
          crates/heiwa_embed
          crates/heiwa_install
          crates/heiwa_loop
          crates/heiwa_mcp
          crates/heiwa_protocol
          crates/heiwa_provider
          crates/heiwa_quota
          crates/heiwa_repl
          crates/heiwa_session
          crates/heiwa_stdb
          crates/heiwa_tui
          crates/heiwa_vault
          packages/heiwa_bindings/rust

  lint:
    name: TypeScript and Web Lint
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Biome
        run: npm run lint

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build MkDocs site
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict

  agent-sync-check:
    name: Agent Sync Check
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify canonical agent sync
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/sync_agents.py --check

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v5
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: bash scripts/check_release_metadata.sh
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep
      - name: Run audit gates
        run: |
          python3 scripts/validate_connector_manifests.py
          bats tests/audit/*.bats
