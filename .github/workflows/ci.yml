name: Heiwa CI

# CI economy: runs on PRs targeting main (the production gate) and manual
# dispatch. No push:main trigger — the PR already validated the merge ref,
# and only PRs can update main under branch protection.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install cargo-audit
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit
      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.4
      - name: Install dependency and secret audit tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.12.1
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix apps/heiwa_app/clients/cockpit
          npm ci --ignore-scripts --prefix apps/heiwa_app/desktop
      - name: Run multi-ecosystem security gate
        run: bash scripts/verify_security.sh
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH

  rust-matrix:
    name: Rust Build, Test, and Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # PR CI gates correctness, not artifacts: skip debuginfo and incremental
      # bookkeeping to cut compile time and cache size.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
          prefix-key: v2-rust
          cache-bin: true
      # heiwa-shell enables the `lance` feature by default, which pulls
      # lancedb -> lance-encoding -> prost-build, whose build script shells out
      # to `protoc`. No runner ships it, so the workspace does not build without
      # this step. Developers miss it locally because Homebrew/apt usually
      # already provide protoc.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # keyring's sync-secret-service backend links libdbus; that is the only
      # other system dependency the non-desktop workspace needs on Linux.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      # heiwa-desktop (Tauri shell) is excluded here: its wry/webkit dep tree
      # dominates compile time and needs OS GUI packages. The desktop-check
      # job covers it on macOS when its files change; releases build it fully.
      - name: Cargo test
        run: cargo test --workspace --exclude heiwa-desktop --locked
      - name: Cargo fmt
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        run: >
          cargo clippy --workspace --exclude heiwa-desktop --locked --all-targets --
          -A clippy::too_many_arguments
          -A clippy::new_without_default
          -A clippy::unnecessary_to_owned
          -A clippy::needless_range_loop
          -A clippy::approx_constant
          -A clippy::collapsible_if
          -A clippy::bool_assert_comparison
          -A clippy::type_complexity
          -A clippy::needless_borrows_for_generic_args
          -A clippy::unnecessary_unwrap
          -D warnings
      - name: Install cargo-machete
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-machete
      - name: Check unused Rust dependencies
        if: matrix.os == 'ubuntu-latest'
        # Scan the whole workspace rather than a hand-maintained path list.
        # The old list named 16 paths and had drifted: heiwa_evidence,
        # heiwa_drex, heiwa_automations, heiwa_receipts, heiwa_a2a,
        # heiwa_memory and heiwa_resource were never checked - including the
        # two crates the current backend is built on. Unused deps had
        # accumulated there unnoticed.
        run: cargo machete

  lint:
    name: TypeScript and Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Biome
        run: npm run lint
      - name: Validate public-only web artifact
        run: |
          python3 apps/heiwa_app/scripts/check_static_surface.py
          bash scripts/check_public_web_package.sh

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build MkDocs site
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict

  agent-sync-check:
    name: Agent Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify canonical agent sync
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/sync_agents.py --check

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: bash scripts/check_release_metadata.sh
      - name: Verify immutable workflow action pins
        run: bash scripts/check_workflow_pins.sh
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep shellcheck
      - name: Run audit gates
        run: |
          python3 scripts/validate_connector_manifests.py
          bash scripts/check_public_installer.sh
          bats tests/audit/*.bats

  # Non-required advisory job: compiles the Tauri desktop shell on its native
  # target only when desktop sources change. Keeps the heavy wry/webkit tree
  # out of the required matrix while preserving compile coverage.
  desktop-check:
    name: Desktop Shell Check (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Detect desktop changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            desktop:
              - 'apps/heiwa_app/desktop/**'
      - name: Install Rust toolchain
        if: steps.filter.outputs.desktop == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Rust cache
        if: steps.filter.outputs.desktop == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
          prefix-key: v2-rust-desktop
      - name: Cargo check desktop shell
        if: steps.filter.outputs.desktop == 'true'
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_INCREMENTAL: "0"
        run: cargo check -p heiwa-desktop --locked
