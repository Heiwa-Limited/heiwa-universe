name: Heiwa CI

# CI is the sub-minute change gate. Compilation, tests, and other cache-sensitive
# proofs run independently in certification.yml at every protected-main commit.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          security_bin="$RUNNER_TEMP/security-bin"
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "$security_bin"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$security_bin" gitleaks
          echo "$security_bin" >> "$GITHUB_PATH"
      - name: Run mandatory secret scan
        run: gitleaks detect --no-banner --redact --source .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  rust-tests:
    name: Rust Tests
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 1
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install on-demand compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux system dependencies
        run: sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Run Rust tests
        run: |
          bash scripts/ci_rust_test_group.sh --check
          cargo test --workspace --exclude heiwa-desktop --locked --no-default-features

  rust-static:
    name: Rust Static Checks
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 1
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt
      - name: Install on-demand compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux system dependencies
        run: sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Rust clippy
        run: >
          cargo clippy --workspace --exclude heiwa-desktop --locked --all-targets
          --no-default-features --
          -A clippy::too_many_arguments
          -A clippy::new_without_default
          -A clippy::unnecessary_to_owned
          -A clippy::needless_range_loop
          -A clippy::approx_constant
          -A clippy::collapsible_if
          -A clippy::bool_assert_comparison
          -A clippy::type_complexity
          -A clippy::needless_borrows_for_generic_args
          -A clippy::unnecessary_unwrap
          -D warnings
      - name: Install cargo-machete
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-machete
      - name: Check unused Rust dependencies
        run: cargo machete

  lint:
    name: TypeScript and Web Lint
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Biome
        run: npm run lint
      - name: Validate public-only web artifact
        run: |
          python3 apps/heiwa_app/scripts/check_static_surface.py
          bash scripts/check_public_web_package.sh

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build MkDocs site
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict

  agent-sync-check:
    name: Agent Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify canonical agent sync
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/sync_agents.py --check

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: |
          bash scripts/check_release_metadata.sh
          bash scripts/tests/test_ci_job_deadlines.sh
      - name: Verify immutable workflow action pins
        run: bash scripts/check_workflow_pins.sh
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep shellcheck
      - name: Run audit gates
        run: |
          python3 scripts/validate_connector_manifests.py
          bash scripts/check_public_installer.sh
          bats tests/audit/*.bats
