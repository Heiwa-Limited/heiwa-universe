name: Heiwa CI

# CI is the sub-minute change gate. Heavy cross-platform, Lance, desktop, and
# multi-ecosystem proofs run independently in certification.yml. The main run
# remains so protected-main caches are reusable by later pull requests.
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Changed Surfaces
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      lance: ${{ steps.classify.outputs.lance }}
      dependency_security: ${{ steps.classify.outputs.dependency_security }}
      desktop: ${{ steps.classify.outputs.desktop }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] ||
            [[ -z "$BASE_SHA" ]] ||
            [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            scripts/detect_ci_surfaces.sh --all >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Classification is security-sensitive: a PR must not be allowed
            # to edit the classifier that decides whether its own dependency
            # audits run. Execute the script from the protected base commit.
            trusted_classifier="$RUNNER_TEMP/detect_ci_surfaces.sh"
            if git show "$BASE_SHA:scripts/detect_ci_surfaces.sh" > "$trusted_classifier" 2>/dev/null; then
              git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE_SHA" "$HEAD_SHA" \
                | bash "$trusted_classifier" --paths >> "$GITHUB_OUTPUT"
            else
              # Bootstrap safely when the protected base predates the
              # classifier: exercise every surface rather than trust the PR.
              scripts/detect_ci_surfaces.sh --all >> "$GITHUB_OUTPUT"
            fi
          else
            scripts/detect_ci_surfaces.sh "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          security_bin="$RUNNER_TEMP/security-bin"
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "$security_bin"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$security_bin" gitleaks
          echo "$security_bin" >> "$GITHUB_PATH"
      - name: Run mandatory secret scan
        run: gitleaks detect --no-banner --redact --source .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  rust-pr-tests:
    name: Rust Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: shell-unit
            needs_native_vault: true
          - group: shell-api
            needs_native_vault: true
          - group: shell-state
            needs_native_vault: true
          - group: shell-ops
            needs_native_vault: true
          - group: runtime-unit
            needs_native_vault: true
          - group: runtime-a
            needs_native_vault: true
          - group: runtime-b
            needs_native_vault: true
          - group: foundation-unit
            needs_native_vault: false
          - group: foundation-a
            needs_native_vault: false
          - group: foundation-b
            needs_native_vault: false
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Skip unchanged Rust surface
        if: needs.changes.outputs.rust != 'true'
        run: echo "Rust inputs are unchanged."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: needs.changes.outputs.rust == 'true'
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
      - name: Install on-demand compiler cache
        if: needs.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux system dependencies
        if: needs.changes.outputs.rust == 'true' && matrix.needs_native_vault
        run: sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install cargo-nextest
        if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        run: bash scripts/ci_rust_test_group.sh "${{ matrix.group }}"

  rust-pr-static:
    name: Rust Static Checks
    runs-on: ubuntu-latest
    needs: changes
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Skip unchanged Rust surface
        if: needs.changes.outputs.rust != 'true'
        run: echo "Rust inputs are unchanged."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: needs.changes.outputs.rust == 'true'
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy
      - name: Install on-demand compiler cache
        if: needs.changes.outputs.rust == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Install Linux system dependencies
        if: needs.changes.outputs.rust == 'true'
        run: sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Cargo fmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        if: needs.changes.outputs.rust == 'true'
        run: >
          cargo clippy --workspace --exclude heiwa-desktop --locked --all-targets
          --no-default-features --
          -A clippy::too_many_arguments
          -A clippy::new_without_default
          -A clippy::unnecessary_to_owned
          -A clippy::needless_range_loop
          -A clippy::approx_constant
          -A clippy::collapsible_if
          -A clippy::bool_assert_comparison
          -A clippy::type_complexity
          -A clippy::needless_borrows_for_generic_args
          -A clippy::unnecessary_unwrap
          -D warnings
      - name: Install cargo-machete
        if: needs.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-machete
      - name: Check unused Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        run: cargo machete

  rust-pr-result:
    name: Rust Build, Test, and Clippy (ubuntu-latest)
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [changes, rust-pr-tests, rust-pr-static]
    steps:
      - name: Require Rust tests and static checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEST_RESULT: ${{ needs.rust-pr-tests.result }}
          STATIC_RESULT: ${{ needs.rust-pr-static.result }}
        run: |
          set -euo pipefail
          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$TEST_RESULT" == "success" ]]
          [[ "$STATIC_RESULT" == "success" ]]

  lint:
    name: TypeScript and Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run Biome
        run: npm run lint
      - name: Validate public-only web artifact
        run: |
          python3 apps/heiwa_app/scripts/check_static_surface.py
          bash scripts/check_public_web_package.sh

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Build MkDocs site
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict

  agent-sync-check:
    name: Agent Sync Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Verify canonical agent sync
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/sync_agents.py --check

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: bash scripts/check_release_metadata.sh
      - name: Verify immutable workflow action pins
        run: bash scripts/check_workflow_pins.sh
      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats ripgrep shellcheck
      - name: Run audit gates
        run: |
          python3 scripts/validate_connector_manifests.py
          bash scripts/check_public_installer.sh
          bash scripts/tests/test_detect_ci_surfaces.sh
          bats tests/audit/*.bats
