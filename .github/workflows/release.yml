name: Heiwa Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: heiwa-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${DISPATCH_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.1.0" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  cockpit:
    name: Build Cockpit Assets
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build cockpit
        run: |
          npm ci --ignore-scripts
          npm --prefix apps/heiwa_app/clients/cockpit run build
          test -f apps/heiwa_app/clients/cockpit/dist/index.html
          test -n "$(find apps/heiwa_app/clients/cockpit/dist/assets -type f -print -quit)"
      - name: Upload cockpit assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cockpit
          path: apps/heiwa_app/clients/cockpit/dist/
          if-no-files-found: error

  build:
    name: Build Release Asset (${{ matrix.name }})
    needs: [metadata, cockpit]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: heiwa
          - name: macos-aarch64
            # macos-14 is retiring; macos-26 GA since 2026-02-26. Keep the
            # bundle minimumSystemVersion floor at 14.0 — runner != floor.
            runner: macos-26
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_name: heiwa
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: heiwa.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          target: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
          prefix-key: v1-rust
          cache-bin: false

      # heiwa-shell defaults to the `lance` feature, whose lance-encoding
      # dependency shells out to `protoc` at build time. Without this the
      # release binary does not build on any runner.
      - name: Install protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Build release binary
        run: cargo build --locked --release -p heiwa-shell --bin heiwa --target ${{ matrix.target }}

      - name: Download cockpit assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cockpit
          path: cockpit-dist

      - name: Package archive
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ASSET_NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          set -euo pipefail

          release_root="dist/heiwa-${VERSION}-${ASSET_NAME}"
          archive_path="${release_root}.${ARCHIVE_EXT}"
          binary_path="target/${TARGET}/release/${BINARY_NAME}"

          mkdir -p "${release_root}/cockpit"
          cp "${binary_path}" "${release_root}/"
          cp README.md CONTRIBUTING.md CODE_OF_CONDUCT.md LICENSE "${release_root}/"
          cp -R cockpit-dist/. "${release_root}/cockpit/"
          test -f "${release_root}/cockpit/index.html"
          test -n "$(find "${release_root}/cockpit/assets" -type f -print -quit)"

          if [[ "${ARCHIVE_EXT}" == "zip" ]]; then
            7z a "${archive_path}" "${release_root}" >/dev/null
          else
            tar -C dist -czf "${archive_path}" "heiwa-${VERSION}-${ASSET_NAME}"
          fi

      - name: Upload packaged asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: dist/heiwa-${{ needs.metadata.outputs.version }}-${{ matrix.name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  checksums:
    name: Generate Checksums
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-*"
          path: dist
          merge-multiple: true

      - name: Write checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum heiwa-* > "heiwa-${{ needs.metadata.outputs.version }}-checksums.txt"

      - name: Upload checksum artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: dist/heiwa-${{ needs.metadata.outputs.version }}-checksums.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [metadata, build, checksums]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: "*-*"
          path: release-artifacts
          merge-multiple: true

      - name: Download checksum manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: checksums
          path: release-artifacts

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-artifacts/*

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: Heiwa ${{ needs.metadata.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*

  container:
    name: Build and Push Container Image
    needs: [metadata, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lower-cased image name
        id: img
        shell: bash
        run: |
          owner_lower="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lower}/heiwa" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/heiwa_shell/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.img.outputs.image }}:${{ needs.metadata.outputs.tag }}
            ${{ steps.img.outputs.image }}:${{ needs.metadata.outputs.version }}
            ${{ steps.img.outputs.image }}:latest
          provenance: mode=max
          sbom: true
