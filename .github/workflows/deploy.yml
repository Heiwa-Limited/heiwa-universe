name: Heiwa Deploy

# Deliberate deploys only: manual dispatch (surface detection runs --all).
# No push:main trigger — merging to main must not implicitly republish the
# public shell; releases ride v* tags (pages.yml, release.yml).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Deploy Surfaces
    runs-on: ubuntu-latest
    outputs:
      deploy_core: ${{ steps.detect.outputs.deploy_core }}
      deploy_trading: ${{ steps.detect.outputs.deploy_trading }}
      deploy_web: ${{ steps.detect.outputs.deploy_web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            scripts/detect_changed_surfaces.sh --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"
          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || git rev-list --max-count=1 HEAD)"
          fi

          scripts/detect_changed_surfaces.sh "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: bash scripts/check_release_metadata.sh

  core-release-preflight:
    name: Core Rust Release Preflight
    runs-on: ubuntu-latest
    needs:
      - changes
      - repo-hygiene
    steps:
      - uses: actions/checkout@v5
      - name: Skip core release preflight
        if: needs.changes.outputs.deploy_core != 'true'
        run: echo "No Rust runtime release changes detected."
      - name: Install Rust toolchain
        if: needs.changes.outputs.deploy_core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Rust Cache
        if: needs.changes.outputs.deploy_core == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
          prefix-key: v1-rust
          cache-bin: false
      - name: Install Linux Tauri system dependencies
        if: needs.changes.outputs.deploy_core == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config
      # heiwa-shell defaults to the `lance` feature -> lance-encoding ->
      # prost-build, which requires `protoc` on PATH.
      - name: Install protoc
        if: needs.changes.outputs.deploy_core == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Rust release preflight
        if: needs.changes.outputs.deploy_core == 'true'
        run: cargo test --workspace --locked

  web-release-preflight:
    name: Web Release Preflight
    runs-on: ubuntu-latest
    needs:
      - changes
      - repo-hygiene
    steps:
      - uses: actions/checkout@v5
      - name: Skip web release preflight
        if: needs.changes.outputs.deploy_web != 'true'
        run: echo "No hosted web changes detected."
      - name: Set up Node
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm workspace dependencies
        if: needs.changes.outputs.deploy_web == 'true'
        run: npm ci --ignore-scripts
      - name: Run root typecheck
        if: needs.changes.outputs.deploy_web == 'true'
        run: npm run typecheck
      - name: Set up Python
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate static public shell
        if: needs.changes.outputs.deploy_web == 'true'
        run: python apps/heiwa_app/scripts/check_static_surface.py

  deploy-web:
    name: Deploy Cloudflare Public Shell
    runs-on: ubuntu-latest
    needs:
      - changes
      - web-release-preflight
      - repo-hygiene
    if: needs.changes.outputs.deploy_web == 'true'
    env:
      ENABLE_CLOUDFLARE_DEPLOY: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Skip Cloudflare deploy (disabled)
        if: env.ENABLE_CLOUDFLARE_DEPLOY != 'true'
        run: echo "Cloudflare deploy disabled; set ENABLE_CLOUDFLARE_DEPLOY=true after public publish credentials are verified."
      - name: Require Cloudflare credentials
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && (env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '')
        run: |
          echo "ENABLE_CLOUDFLARE_DEPLOY=true but Cloudflare credentials are missing." >&2
          exit 1
      - name: Deploy to Cloudflare Pages
        if: env.ENABLE_CLOUDFLARE_DEPLOY == 'true' && env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/heiwa_app/clients/web --project-name=heiwa-clients --branch=main
