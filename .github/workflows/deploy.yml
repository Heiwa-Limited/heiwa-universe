name: Heiwa Public Surface CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  hub-smoke-tests:
    name: Hub Smoke Tests
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/heiwa_cli:${{ github.workspace }}/packages/heiwa_cognition:${{ github.workspace }}/packages/heiwa_sdk:${{ github.workspace }}/packages/heiwa_protocol:${{ github.workspace }}/packages/heiwa_identity:${{ github.workspace }}/packages/heiwa_ui:${{ github.workspace }}/apps:${{ github.workspace }}/apps/heiwa_trading/src
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate schema artifact
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          try:
              json.loads(Path('config/schemas/artifact_index.schema.json').read_text())
              print('Schema valid.')
              sys.exit(0)
          except Exception as e:
              print(f'Schema invalid: {e}')
              sys.exit(1)
          "
      - name: Run intent classifier smoke test
        run: python apps/heiwa_hub/tests/test_intent_classifier.py
      - name: Run risk scorer smoke test
        run: python apps/heiwa_hub/tests/test_risk_scorer.py
      - name: Run compute router smoke test
        run: python apps/heiwa_hub/tests/test_compute_router.py
      - name: Run agent context map test
        run: python apps/heiwa_hub/tests/test_agent_context_map.py
      - name: Run HeiwaClaw gateway contract test
        run: python apps/heiwa_hub/tests/test_heiwaclaw_gateway.py
      - name: Run HeiwaCells catalog test
        run: python apps/heiwa_hub/tests/test_heiwa_cells_catalog.py
      - name: Run HeiwaBench release-gate test
        run: python apps/heiwa_hub/tests/test_heiwa_bench.py
      - name: Run state service test
        run: python apps/heiwa_hub/tests/test_state_service.py
      - name: Run security posture test
        run: python apps/heiwa_hub/tests/test_security_posture.py
      - name: Run STDB native state routing test
        run: python apps/heiwa_hub/tests/test_stdb_native_state.py
      - name: Run STDB proposal lifecycle test
        run: python apps/heiwa_hub/tests/test_stdb_proposal_lifecycle.py
      - name: Run MCP server surface test
        run: python apps/heiwa_hub/tests/test_mcp_server_surface.py
      - name: Run CLI import chain test
        run: python apps/heiwa_hub/tests/test_cli_import_chain.py
      - name: Run unified pytest suite
        run: pytest apps/heiwa_hub/tests/ apps/heiwa_trading/tests/ -v

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build MkDocs site
        run: mkdocs build --strict

  web-static-checks:
    name: Web Static Checks
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Validate static public shell
        run: python apps/heiwa_web/scripts/check_static_surface.py

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs:
      - hub-smoke-tests
      - docs-build
      - repo-hygiene
      - web-static-checks
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy Swarm
        run: railway up --service heiwa-cloud-hq --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Set up Python for Checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install verification dependencies
        run: pip install requests
      - name: Await Deployment (Sleep)
        run: sleep 45
      - name: Verify public runtime endpoints
        run: |
          python - <<'PY'
          import requests

          urls = [
              "https://api.heiwa.ltd/health",
              "https://api.heiwa.ltd/status",
          ]

          failures = []
          for url in urls:
              try:
                  response = requests.get(url, timeout=15)
                  print(f"{url} -> HTTP {response.status_code}")
                  if response.status_code >= 400:
                      failures.append(f"{url} returned HTTP {response.status_code}")
              except Exception as exc:
                  failures.append(f"{url} failed: {exc}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

  deploy-web:
    name: Deploy Cloudflare Public Shell
    runs-on: ubuntu-latest
    needs:
      - docs-build
      - repo-hygiene
      - web-static-checks
    if: github.ref == 'refs/heads/main'
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/heiwa_web/clients/web --project-name=heiwa-clients
      - name: Skip (no Cloudflare secrets)
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets not configured — skipping web deploy"
