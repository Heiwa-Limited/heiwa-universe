name: Heiwa Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heiwa-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Deploy Surfaces
    runs-on: ubuntu-latest
    outputs:
      deploy_core: ${{ steps.detect.outputs.deploy_core }}
      deploy_trading: ${{ steps.detect.outputs.deploy_trading }}
      deploy_web: ${{ steps.detect.outputs.deploy_web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            scripts/detect_changed_surfaces.sh --all >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="${{ github.event.before }}"
          head_sha="${{ github.sha }}"
          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-count=1 HEAD^ 2>/dev/null || git rev-list --max-count=1 HEAD)"
          fi

          scripts/detect_changed_surfaces.sh "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY
      - name: Verify heiwa-core Dockerfile Rust floor
        run: bash scripts/check_heiwa_core_dockerfile.sh
      - name: Verify runtime baseline pins
        run: bash scripts/check_runtime_baseline.sh
      - name: Verify release metadata
        run: bash scripts/check_release_metadata.sh

  core-release-preflight:
    name: Core Rust Release Preflight
    runs-on: ubuntu-latest
    needs:
      - changes
      - repo-hygiene
    steps:
      - uses: actions/checkout@v5
      - name: Skip core release preflight
        if: needs.changes.outputs.deploy_core != 'true'
        run: echo "No hosted Rust backend changes detected."
      - name: Install Rust toolchain
        if: needs.changes.outputs.deploy_core == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - name: Rust Cache
        if: needs.changes.outputs.deploy_core == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
      - name: Run hosted backend preflight
        if: needs.changes.outputs.deploy_core == 'true'
        run: cargo test --workspace --locked

  web-release-preflight:
    name: Web Release Preflight
    runs-on: ubuntu-latest
    needs:
      - changes
      - repo-hygiene
    steps:
      - uses: actions/checkout@v5
      - name: Skip web release preflight
        if: needs.changes.outputs.deploy_web != 'true'
        run: echo "No hosted web changes detected."
      - name: Set up Node
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install npm workspace dependencies
        if: needs.changes.outputs.deploy_web == 'true'
        run: npm ci --ignore-scripts
      - name: Run root typecheck
        if: needs.changes.outputs.deploy_web == 'true'
        run: npm run typecheck
      - name: Set up Python
        if: needs.changes.outputs.deploy_web == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate static public shell
        if: needs.changes.outputs.deploy_web == 'true'
        run: python apps/heiwa_app/scripts/check_static_surface.py

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs:
      - changes
      - core-release-preflight
      - repo-hygiene
    if: needs.changes.outputs.deploy_core == 'true' || needs.changes.outputs.deploy_trading == 'true'
    env:
      ENABLE_TRADING_DEPLOY: ${{ vars.ENABLE_TRADING_DEPLOY }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Deploy core service
        if: needs.changes.outputs.deploy_core == 'true'
        run: railway up --service heiwa-core --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy trading service
        if: needs.changes.outputs.deploy_trading == 'true' && env.ENABLE_TRADING_DEPLOY == 'true'
        working-directory: apps/heiwa_trading
        run: railway up --service heiwa-trading --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Skip trading deploy (service disabled or unchanged)
        if: needs.changes.outputs.deploy_trading != 'true' || env.ENABLE_TRADING_DEPLOY != 'true'
        run: echo "Trading deploy skipped."
      - name: Set up Python for Checks
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install verification dependencies
        run: pip install requests
      - name: Verify core runtime endpoints (retry with backoff)
        run: |
          python - <<'PY'
          import requests, time

          urls = [
              "https://api.heiwa.ltd/health",
              "https://api.heiwa.ltd/status",
          ]

          max_attempts = 8
          wait_seconds = 30

          for attempt in range(1, max_attempts + 1):
              print(f"\n--- Attempt {attempt}/{max_attempts} (waited {(attempt-1)*wait_seconds}s total) ---")
              failures = []
              for url in urls:
                  try:
                      response = requests.get(url, timeout=15)
                      print(f"{url} -> HTTP {response.status_code}")
                      if response.status_code >= 400:
                          failures.append(f"{url} returned HTTP {response.status_code}")
                  except Exception as exc:
                      failures.append(f"{url} failed: {exc}")

              if not failures:
                  print("\nAll endpoints healthy.")
                  break

              if attempt < max_attempts:
                  print(f"Retrying in {wait_seconds}s...")
                  time.sleep(wait_seconds)
              else:
                  raise SystemExit("Endpoints still unhealthy after all retries:\n" + "\n".join(failures))
          PY

  deploy-web:
    name: Deploy Cloudflare Public Shell
    runs-on: ubuntu-latest
    needs:
      - changes
      - web-release-preflight
      - repo-hygiene
    if: needs.changes.outputs.deploy_web == 'true'
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/heiwa_app/clients/web --project-name=heiwa-clients
      - name: Skip (no Cloudflare secrets)
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets not configured — skipping web deploy"
