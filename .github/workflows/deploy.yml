name: Heiwa Public Surface CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  core-build-and-test:
    name: Core Rust Build & Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/heiwa_core
            apps/heiwa_hub/spacetimedb
            packages/heiwa_bindings/rust
      - name: Build Core
        run: cargo build -p heiwa-core --release
      - name: Run Core Tests
        run: cargo test -p heiwa-core

  python-regression-tests:
    name: Python Regression Tests
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/heiwa_cli:${{ github.workspace }}/packages/heiwa_cognition:${{ github.workspace }}/packages/heiwa_sdk:${{ github.workspace }}/packages/heiwa_protocol:${{ github.workspace }}/packages/heiwa_identity:${{ github.workspace }}/packages/heiwa_ui:${{ github.workspace }}/apps:${{ github.workspace }}/apps/heiwa_trading/src
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unified pytest suite (Packages & Trading)
        run: pytest packages/ apps/heiwa_trading/tests/ -v

  legacy-hub-tests:
    name: Legacy Hub Tests (Non-blocking)
    runs-on: ubuntu-latest
    needs: security-scan
    continue-on-error: true
    env:
      PYTHONPATH: ${{ github.workspace }}/packages/heiwa_cli:${{ github.workspace }}/packages/heiwa_cognition:${{ github.workspace }}/packages/heiwa_sdk:${{ github.workspace }}/packages/heiwa_protocol:${{ github.workspace }}/packages/heiwa_identity:${{ github.workspace }}/packages/heiwa_ui:${{ github.workspace }}/apps
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run legacy hub tests
        run: pytest apps/heiwa_hub/tests/ -v

  agent-sync-check:
    name: Agent Sync Check
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Verify canonical agent sync
        run: python scripts/sync_agents.py --check

  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked cargo cache artifacts
        run: |
          python - <<'PY'
          import subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [path for path in tracked if "D:\\cache\\cargo" in path]
          if bad:
              raise SystemExit("Tracked cargo cache artifacts detected:\n" + "\n".join(bad[:20]))
          print("Repo hygiene check passed.")
          PY

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
      - name: Build MkDocs site
        run: mkdocs build --strict

  web-static-checks:
    name: Web Static Checks
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Validate static public shell
        run: python apps/heiwa_web/scripts/check_static_surface.py

  deploy-railway:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs:
      - core-build-and-test
      - python-regression-tests
      - docs-build
      - repo-hygiene
      - agent-sync-check
      - web-static-checks
    if: github.ref == 'refs/heads/main'
    env:
      ENABLE_TRADING_DEPLOY: ${{ vars.ENABLE_TRADING_DEPLOY }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm i -g @railway/cli
      - name: Deploy core service
        run: railway up --service heiwa-core --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Deploy trading service
        if: env.ENABLE_TRADING_DEPLOY == 'true'
        working-directory: apps/heiwa_trading
        run: railway up --service heiwa-trading --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      - name: Skip trading deploy (service not enabled)
        if: env.ENABLE_TRADING_DEPLOY != 'true'
        run: echo "ENABLE_TRADING_DEPLOY is not true — skipping heiwa-trading deploy"
      - name: Set up Python for Checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
      - name: Install verification dependencies
        run: pip install requests
      - name: Verify core runtime endpoints (retry with backoff)
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests, time

          urls = [
              "https://api.heiwa.ltd/health",
              "https://api.heiwa.ltd/status",
          ]

          max_attempts = 8
          wait_seconds = 30

          for attempt in range(1, max_attempts + 1):
              print(f"\n--- Attempt {attempt}/{max_attempts} (waited {(attempt-1)*wait_seconds}s total) ---")
              failures = []
              for url in urls:
                  try:
                      response = requests.get(url, timeout=15)
                      print(f"{url} -> HTTP {response.status_code}")
                      if response.status_code >= 400:
                          failures.append(f"{url} returned HTTP {response.status_code}")
                  except Exception as exc:
                      failures.append(f"{url} failed: {exc}")

              if not failures:
                  print("\nAll endpoints healthy.")
                  break

              if attempt < max_attempts:
                  print(f"Retrying in {wait_seconds}s...")
                  time.sleep(wait_seconds)
              else:
                  raise SystemExit("Endpoints still unhealthy after all retries:\n" + "\n".join(failures))
          PY
  deploy-web:
    name: Deploy Cloudflare Public Shell
    runs-on: ubuntu-latest
    needs:
      - docs-build
      - repo-hygiene
      - web-static-checks
    if: github.ref == 'refs/heads/main'
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Pages
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/heiwa_web/clients/web --project-name=heiwa-clients
      - name: Skip (no Cloudflare secrets)
        if: env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == ''
        run: echo "Cloudflare secrets not configured — skipping web deploy"
