[service]
name = "heiwa-cloud-hq"

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/heiwa_hub/Dockerfile"

[deploy]
# Transitional entrypoint: keep shell bootstrap stable while orchestration
# migrates behind it from Python to Rust.
startCommand = "bash apps/heiwa_hub/start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 30
