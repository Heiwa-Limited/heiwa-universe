# Heiwa project-level Codex config
# Overrides ~/.codex/config.toml within ~/heiwa-universe/
#
# Model and personality are inherited. Approval and sandbox defaults are
# explicit here; this file does not change a running desktop session.
# Use native Git tooling; do not add duplicate gateways or unverified packages.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[mcp_servers.railway]
command = "npx"
args = ["@railway/mcp-server"]

[mcp_servers.MCP_DOCKER]
command = "docker"
args = ["mcp", "gateway", "run"]

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.codebase-retrieval]
command = "auggie"
args = ["--mcp", "--mcp-auto-workspace"]

[features]
multi_agent = true
guardian_approval = false
prevent_idle_sleep = true

[plugins."github@openai-curated"]
enabled = true

[plugins."cloudflare@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."hugging-face@openai-curated"]
enabled = true
