[workspace]
members = [
    "apps/heiwa_core",
    "apps/heiwa_hub/heiwaproductiondb/spacetimedb",
    "apps/heiwa_hub/spacetimedb",
    "apps/heiwa_orchestrator",
    "apps/heiwa_shell",
    "crates/heiwa_install",
    "crates/heiwa_loop",
    "crates/heiwa_protocol",
    "crates/heiwa_provider",
    "crates/heiwa_repl",
    "crates/heiwa_session",
    "crates/heiwa_stdb",
    "crates/heiwa_tui",
    "crates/heiwa_vault",
    "packages/heiwa_bindings/rust",
]
resolver = "2"

[workspace.package]
license = "UNLICENSED"
repository = "https://github.com/Strategizing/heiwa-universe"
homepage = "https://github.com/Strategizing/heiwa-universe"
documentation = "https://strategizing.github.io/heiwa-universe/"
readme = "README.md"
keywords = ["heiwa", "ai", "agents", "cli", "local-first"]
categories = ["command-line-utilities", "development-tools"]
