[workspace]
members = [
    "apps/heiwa_core",
    "apps/heiwa_orchestrator",
    "apps/heiwa_shell",
    "crates/heiwa_a2a",
    "crates/heiwa_config",
    "crates/heiwa_drex",
    "crates/heiwa_embed",
    "crates/heiwa_install",
    "crates/heiwa_loop",
    "crates/heiwa_memory",
    "crates/heiwa_mcp",
    "crates/heiwa_protocol",
    "crates/heiwa_provider",
    "crates/heiwa_quota",
    "crates/heiwa_receipts",
    "crates/heiwa_resource",
    "crates/heiwa_repl",
    "crates/heiwa_session",
    "crates/heiwa_stdb",
    "crates/heiwa_tui",
    "crates/heiwa_vault",
    "packages/heiwa_bindings/rust",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
repository = "https://github.com/Strategizing/heiwa-universe"
homepage = "https://github.com/Strategizing/heiwa-universe"
documentation = "https://strategizing.github.io/heiwa-universe/"
readme = "README.md"
keywords = ["heiwa", "ai", "agents", "cli", "local-first"]
categories = ["command-line-utilities", "development-tools"]
