[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heiwa-cli"
version = "0.1.0"
description = "Heiwa CLI — agent OS for terminal"
requires-python = ">=3.11"
dependencies = [
    "heiwa-cognition",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.43",
    "requests>=2.32.0",
]

[project.scripts]
heiwa = "heiwa_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["heiwa_cli*"]
