[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heiwa-cognition"
version = "0.1.0"
description = "Heiwa shared decision engine — intent, risk, routing, approval, planning"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "tenacity>=8.2.0",
]

[tool.setuptools.packages.find]
include = ["heiwa_cognition*"]
