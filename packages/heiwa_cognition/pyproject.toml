[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "heiwa-cognition"
version = "0.1.0"
description = "Heiwa shared decision engine — intent, risk, routing, approval, planning"
requires-python = ">=3.11"
authors = [{ name = "Heiwa", email = "noreply@heiwa.dev" }]
license = { text = "Apache-2.0" }
dependencies = [
    "requests>=2.32.0",
    "tenacity>=8.2.0",
]

[project.urls]
Homepage = "https://github.com/Strategizing/heiwa-universe"
Repository = "https://github.com/Strategizing/heiwa-universe"
Documentation = "https://strategizing.github.io/heiwa-universe/"
Issues = "https://github.com/Strategizing/heiwa-universe/issues"

[tool.setuptools.packages.find]
include = ["heiwa_cognition*"]
