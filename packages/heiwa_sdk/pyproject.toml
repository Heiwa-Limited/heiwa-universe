[project]
name = "heiwa-sdk"
version = "0.1.0"
description = "Heiwa Python SDK"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Heiwa", email = "noreply@heiwa.dev" }]
license = { text = "UNLICENSED" }
dependencies = [
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heiwa_sdk"]
