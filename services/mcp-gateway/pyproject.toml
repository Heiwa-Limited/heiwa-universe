[project]
name = "heiwa-mcp-gateway"
version = "0.1.0"
description = "Heiwa MCP gateway — expose Heiwa routing to Grok, Claude, Codex, and OpenAI-compatible clients"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.28.0",
  "uvicorn>=0.34.0",
  "starlette>=0.46.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
heiwa-mcp = "heiwa_mcp_gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["heiwa_mcp_gateway"]
